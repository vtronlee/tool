<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>餐补余额管理</title>
<style>
/* 单文件、零外部资源：不引任何 CDN / 字体 / 图标库。
   钉钉内网或离线环境打开也不会白屏。 */
:root{
  --primary:#1677ff; --primary-dim:#e8f1ff;
  --green:#07a35a; --red:#d93025;
  --bg:#f5f6f8; --card:#fff; --line:#e6e8eb;
  --text:#1f2329; --sub:#8a9099; --warn:#b26a00;
  --radius:10px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif;
  background:var(--bg); color:var(--text); font-size:15px; line-height:1.5;
  touch-action:manipulation; overscroll-behavior-y:contain;
  padding-bottom:calc(16px + env(safe-area-inset-bottom));
}
button{font-family:inherit;font-size:15px;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit;font-size:16px}   /* 16px 防 iOS 自动缩放 */
.wrap{max-width:640px;margin:0 auto}

/* ---- 顶栏 ---- */
header{
  position:sticky;top:0;z-index:10;background:var(--card);
  border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
}
h1{font-size:17px;margin:0;font-weight:600}
.op-chip{
  display:flex;align-items:center;gap:5px;font-size:13px;color:var(--sub);
  padding:6px 10px;border-radius:999px;background:var(--bg);min-height:32px;
}
.op-chip b{color:var(--text);font-weight:500}

/* 注：不显示总余额。每个人只关心自己那一份，
   把一个总数放在最显眼的位置容易被误当成"共用的余额"。 */
.section-title{font-size:13px;color:var(--sub);padding:16px 14px 8px}

/* ---- 列表 ---- */
ul.list{list-style:none;margin:0;padding:0 14px;display:flex;flex-direction:column;gap:8px}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:12px 14px;display:flex;align-items:center;gap:10px;
  min-height:56px;position:relative;transition:background .12s,border-color .12s;
}
.card.sel{border-color:var(--primary);background:var(--primary-dim);
  box-shadow:0 0 0 1px var(--primary) inset}
.card.sel::before{
  content:'';position:absolute;left:0;top:8px;bottom:8px;width:4px;
  border-radius:0 3px 3px 0;background:var(--primary);
}
.card .info{flex:1;min-width:0}
.card .name{font-size:16px;font-weight:500;word-break:break-all}
.card .meta{font-size:12px;color:var(--sub);margin-top:2px;display:flex;gap:8px;
  align-items:center;flex-wrap:wrap}
/* 每人自己的余额——页面的主角，所以最大最重 */
.card .amt-box{display:flex;flex-direction:column;align-items:flex-end;gap:1px;flex-shrink:0}
.card .amt-label{font-size:11px;color:var(--sub)}
.card .amt{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;
  white-space:nowrap;line-height:1.2}
.card .amt.neg{color:var(--red)}
.tag{font-size:11px;padding:1px 6px;border-radius:4px;background:#fff3f2;color:var(--red);
  border:1px solid #ffd9d5;white-space:nowrap}
.tag.sel-tag{background:var(--primary);color:#fff;border-color:var(--primary)}
.del{
  min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center;
  color:var(--sub);font-size:13px;border-radius:8px;flex-shrink:0;
}
.del:active{background:var(--bg);color:var(--red)}

/* ---- 按钮 ---- */
.btn{display:block;width:100%;min-height:46px;border-radius:var(--radius);
  font-size:16px;font-weight:500;text-align:center;padding:12px}
.btn:active{opacity:.85}
.btn-primary{background:var(--primary);color:#fff}
.btn-ghost{background:var(--card);border:1px solid var(--line);color:var(--text)}
.btn-green{background:var(--green);color:#fff}
.btn-red{background:var(--red);color:#fff}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pad{padding:14px}

/* ---- 操作面板 ---- */
.panel{margin:16px 14px 0;background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius);overflow:hidden}
.panel-head{padding:11px 14px;font-size:13px;color:var(--sub);
  background:#fafbfc;border-bottom:1px solid var(--line)}
.panel-head b{color:var(--text);font-weight:600}
.panel-body{padding:14px}
.panel.disabled .panel-body{opacity:.5;pointer-events:none}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:var(--sub);margin-bottom:6px}
.field input{width:100%;padding:11px 12px;border:1px solid var(--line);
  border-radius:8px;background:#fff;outline:none}
.field input:focus{border-color:var(--primary)}
.field .hint{font-size:12px;color:var(--red);margin-top:5px;min-height:16px}
.row{display:flex;gap:10px}
.row .btn{flex:1}

/* ---- 数据区 ---- */
.data-box{margin:16px 14px 0;background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius);padding:14px}
.data-box h3{margin:0 0 4px;font-size:14px;font-weight:600}
.data-box p{margin:0 0 12px;font-size:12px;color:var(--sub);line-height:1.6}
.data-row{display:flex;gap:10px;flex-wrap:wrap}
.data-row .btn{flex:1;min-width:120px;font-size:14px;min-height:42px;padding:10px}
.notice{
  margin:10px 14px 0;padding:10px 12px;border-radius:8px;font-size:12px;
  line-height:1.7;background:#fff8e6;color:var(--warn);border:1px solid #ffe1a8;
}

/* ---- 浮层 / 弹窗 ---- */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;
  display:flex;align-items:flex-end;justify-content:center}
.mask.center{align-items:center;padding:20px}
.sheet{background:var(--bg);width:100%;max-width:640px;border-radius:14px 14px 0 0;
  max-height:88vh;display:flex;flex-direction:column}
.dialog{background:var(--card);border-radius:12px;width:100%;max-width:360px;padding:20px;
  max-height:86vh;overflow-y:auto}
.dialog h3{margin:0 0 10px;font-size:16px}
.dialog p{margin:0 0 16px;font-size:14px;color:var(--sub);line-height:1.6}
.dialog p.tip{margin:10px 0 0;font-size:12px;line-height:1.6;
  background:#f7f8fa;border-radius:6px;padding:8px 10px}
.dialog .row{margin-top:6px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;
  padding:14px;background:var(--card);border-bottom:1px solid var(--line);
  border-radius:14px 14px 0 0;position:sticky;top:0}
.sheet-head h3{margin:0;font-size:16px}
.sheet-body{overflow-y:auto;padding:12px 14px calc(16px + env(safe-area-inset-bottom))}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 0 12px;margin:0;list-style:none}
.chips button{padding:7px 14px;border-radius:999px;background:var(--card);
  border:1px solid var(--line);font-size:13px;white-space:nowrap;min-height:34px}
.chips button.on{background:var(--primary);color:#fff;border-color:var(--primary)}

/* ---- 日志 ---- */
.day-head{position:sticky;top:0;background:var(--bg);font-size:12px;color:var(--sub);
  padding:10px 2px 6px;z-index:1}
.log{background:var(--card);border:1px solid var(--line);border-radius:8px;
  padding:10px 12px;margin-bottom:8px}
.log .l1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.log .l2{font-size:12px;color:var(--sub);margin-top:4px}
.badge{font-size:11px;padding:2px 7px;border-radius:4px;white-space:nowrap}
.badge.recharge{background:#e8f8ef;color:var(--green)}
.badge.deduct{background:#fff3f2;color:var(--red)}
.badge.add_user{background:var(--primary-dim);color:var(--primary)}
.badge.delete_user{background:#f0f1f3;color:var(--sub)}
.log .who{font-weight:500}
.log .delta{font-variant-numeric:tabular-nums;font-weight:600}
.log .delta.recharge{color:var(--green)}
.log .delta.deduct{color:var(--red)}
.log .after{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}

/* ---- 空状态 / 提示 ---- */
.empty{text-align:center;color:var(--sub);font-size:14px;padding:36px 20px;line-height:1.8}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:200;
  background:rgba(31,35,41,.92);color:#fff;padding:10px 18px;border-radius:8px;
  font-size:14px;max-width:80vw;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>餐补余额管理</h1>
    <button class="op-chip" id="opChip">👤 <b id="opName">未设置</b> ▸</button>
  </header>

  <div class="section-title" id="listTitle">成员</div>
  <ul class="list" id="list"></ul>
  <div class="pad"><button class="btn btn-ghost" id="addBtn">＋ 新增用户</button></div>

  <section class="panel disabled" id="panel">
    <div class="panel-head" id="panelHead">请先点击上方成员</div>
    <div class="panel-body">
      <div class="field">
        <label>金额（元）</label>
        <input type="text" inputmode="decimal" autocomplete="off"
               autocorrect="off" spellcheck="false" placeholder="0.5 的整数倍" id="amount">
        <div class="hint" id="amountHint"></div>
      </div>
      <div class="field">
        <label>备注（可选）</label>
        <input type="text" autocomplete="off" placeholder="如：10 月餐补" id="note" maxlength="30">
      </div>
      <div class="row">
        <button class="btn btn-green" id="rechargeBtn">充 值</button>
        <button class="btn btn-red" id="deductBtn">扣 除</button>
      </div>
    </div>
  </section>

  <div class="pad">
    <button class="btn btn-ghost" id="logBtn">📋 查看操作记录</button>
  </div>

  <div class="data-box">
    <h3>数据备份</h3>
    <p>所有数据只保存在本机浏览器里，不会上传到任何服务器。
       清理浏览器缓存、换手机、重装钉钉都会导致数据丢失，请定期导出备份。</p>
    <div class="data-row">
      <button class="btn btn-ghost" id="exportBtn">⬇ 导出备份</button>
      <button class="btn btn-ghost" id="importBtn">⬆ 导入备份</button>
    </div>
  </div>

  <div class="notice" id="notice">
    ⚠ 本工具的数据存在本机浏览器中，<b>清理缓存或更换设备会丢失</b>。
    建议每月导出一次备份，存到钉钉收藏或发给自己。
  </div>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
'use strict';
/* ============================================================
   基础工具
   ============================================================ */
const $ = id => document.getElementById(id);

/** 建元素。文本一律走 textContent——成员名是用户可控内容，
 *  全程禁止 innerHTML，否则一个叫 <img src=x onerror=...> 的名字
 *  就能在所有人的设备上执行脚本。 */
function el(tag, props, children){
  const n = document.createElement(tag);
  if (props) for (const k in props){
    const v = props[k];
    if (v == null) continue;
    if (k === 'text') n.textContent = v;
    else if (k === 'class') n.className = v;
    else if (k === 'onclick') n.addEventListener('click', v);
    else if (k === 'oninput') n.addEventListener('input', v);
    else if (k === 'onchange') n.addEventListener('change', v);
    else if (k === 'onkeydown') n.addEventListener('keydown', v);
    else n.setAttribute(k, v);
  }
  (children || []).forEach(c => {
    if (c == null) return;
    n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return n;
}

let toastTimer = null;
function toast(msg){
  const root = $('toastRoot');
  root.textContent = '';
  root.appendChild(el('div', {class:'toast', text: msg}));
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { root.textContent = ''; }, 2800);
}

/* ============================================================
   金额规则（与共享版一致：0.5 的整数倍，上限 100 元）
   全程整数运算，存"分"，不经过浮点
   ============================================================ */
const AMOUNT_RE = /^\d+(?:\.([05]))?$/;
const MAX_FEN = 10000;          // 100 元

function toFen(v){
  const p = String(v).split('.');
  return parseInt(p[0], 10) * 100 + (p[1] ? parseInt(p[1], 10) * 10 : 0);
}
function fmtFen(fen){
  const s = fen < 0 ? '-' : '';
  const a = Math.abs(fen);
  return s + Math.floor(a / 100) + '.' + Math.floor((a % 100) / 10);
}
function amountError(v){
  if (!v) return '请输入金额';
  if (!AMOUNT_RE.test(v)) return '金额必须是 0.5 的整数倍（如 0.5、1、12.5）';
  const fen = toFen(v);
  if (fen <= 0) return '金额需大于 0';
  if (fen > MAX_FEN) return '单次金额不超过 100 元';
  return '';
}
/** 实时过滤：只留数字和一个小数点，小数位只收 0/5 */
function filterAmount(v){
  let s = String(v).replace(/[^0-9.]/g, '');
  const i = s.indexOf('.');
  if (i >= 0){
    s = s.slice(0, i + 1) + s.slice(i + 1).replace(/\./g, '');
    const head = s.slice(0, i);
    let tail = s.slice(i + 1).slice(0, 1);
    if (tail && tail !== '0' && tail !== '5') tail = '';
    s = head + '.' + tail;
  }
  return s;
}

/* ============================================================
   数据层：全部存在本机 localStorage
   ============================================================ */
const LS_KEY = 'meal_balance_v1';
const DATA_VERSION = 1;

let state = {version: DATA_VERSION, users: [], logs: [], seq: 1};
let storageOK = true;

function loadData(){
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return;
    const d = JSON.parse(raw);
    if (d && Array.isArray(d.users) && Array.isArray(d.logs)){
      state = d;
      if (typeof state.seq !== 'number') state.seq = 1;
    }
  } catch (e){
    console.warn('读取本地数据失败', e);
    toast('读取本地数据失败，已从空数据开始');
  }
}

function saveData(){
  if (!storageOK) return;
  try {
    localStorage.setItem(LS_KEY, JSON.stringify(state));
  } catch (e){
    storageOK = false;
    toast('保存失败：浏览器存储不可用（可能开了无痕模式或空间已满）');
  }
}

/** 探测 localStorage 是否可用——无痕模式下某些浏览器会直接抛异常 */
function checkStorage(){
  try {
    localStorage.setItem('__mb_test__', '1');
    localStorage.removeItem('__mb_test__');
    return true;
  } catch (e){ return false; }
}

function nextId(){
  state.seq = (state.seq || 1) + 1;
  return state.seq;
}

function nowStr(){
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate())
       + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
}

/* ============================================================
   业务逻辑（原来在后端，现在全在前端）
   ============================================================ */
let operator = localStorage.getItem('meal_operator') || '';

function normalizeKey(name){
  return name.replace(/\s+/g, '').toLowerCase();
}

function findUser(id){
  return state.users.find(u => u.id === id) || null;
}

function addUser(name){
  const disp = String(name || '').trim();
  if (!disp){ toast('名字不能为空'); return null; }
  if (disp.length > 20){ toast('名字不超过 20 个字符'); return null; }
  const key = normalizeKey(disp);
  if (state.users.some(u => u.key === key)){
    toast('已存在同名成员「' + disp + '」');
    return null;
  }
  const now = nowStr();
  const u = {id: nextId(), name: disp, key: key, balanceFen: 0,
             createdAt: now, updatedAt: now};
  state.users.push(u);
  state.logs.push({id: nextId(), ts: now, action: 'add_user',
                   userId: u.id, userName: disp, amountFen: 0,
                   balanceAfterFen: 0, operator: operator, note: ''});
  saveData();
  return u;
}

function deleteUser(id){
  const u = findUser(id);
  if (!u) return;
  const note = '删除时余额 ' + fmtFen(u.balanceFen) + ' 元';
  state.users = state.users.filter(x => x.id !== id);
  state.logs.push({id: nextId(), ts: nowStr(), action: 'delete_user',
                   userId: id, userName: u.name, amountFen: 0,
                   balanceAfterFen: null, operator: operator, note: note});
  saveData();
}

function applyTxn(id, amountText, kind, note){
  const u = findUser(id);
  if (!u){ toast('该成员不存在'); return null; }
  const err = amountError(amountText);
  if (err){ toast(err); return null; }
  if (!operator){ toast('请先设置操作人'); openOperator(true); return null; }

  const fen = toFen(amountText);
  const delta = kind === 'recharge' ? fen : -fen;
  u.balanceFen += delta;
  u.updatedAt = nowStr();
  state.logs.push({id: nextId(), ts: u.updatedAt, action: kind,
                   userId: u.id, userName: u.name, amountFen: delta,
                   balanceAfterFen: u.balanceFen, operator: operator,
                   note: note || ''});
  saveData();
  return {user: u, delta: delta};
}

/* ============================================================
   渲染
   ============================================================ */
let selectedId = null;

function render(){
  const list = $('list');
  list.textContent = '';
  $('listTitle').textContent = '成员 · 共 ' + state.users.length + ' 人';

  if (!state.users.length){
    list.appendChild(el('li', {class:'empty',
      text:'还没有成员，点下面的「＋ 新增用户」开始'}));
  }

  state.users.forEach(u => {
    const sel = u.id === selectedId;
    const neg = u.balanceFen < 0;
    const li = el('li', {class:'card' + (sel ? ' sel' : '')}, [
      el('div', {class:'info'}, [
        el('div', {class:'name', text: u.name}),
        el('div', {class:'meta'}, [
          el('span', {text: '更新于 ' + (u.updatedAt || '').slice(5, 16)}),
          neg ? el('span', {class:'tag', text:'⚠ 欠款'}) : null,
          sel ? el('span', {class:'tag sel-tag', text:'✓ 已选中'}) : null,
        ]),
      ]),
      el('div', {class:'amt-box'}, [
        el('span', {class:'amt-label', text:'余额'}),
        el('span', {class:'amt' + (neg ? ' neg' : ''),
                    text: (neg ? '-¥' : '¥') + fmtFen(Math.abs(u.balanceFen))}),
      ]),
      el('button', {class:'del', text:'删除',
                    onclick: e => { e.stopPropagation(); confirmDelete(u); }}),
    ]);
    li.addEventListener('click', () => selectUser(u.id));
    list.appendChild(li);
  });

  const panel = $('panel');
  const sel = findUser(selectedId);
  if (sel){
    panel.className = 'panel';
    $('panelHead').textContent = '';
    $('panelHead').appendChild(document.createTextNode('当前选中：'));
    $('panelHead').appendChild(el('b', {text: sel.name}));
    $('panelHead').appendChild(document.createTextNode(
      '（余额 ¥' + fmtFen(sel.balanceFen) + '）'));
  } else {
    panel.className = 'panel disabled';
    $('panelHead').textContent = '请先点击上方成员';
  }
  updateAmountState();
}

function selectUser(id){
  selectedId = id;
  render();
  const sel = document.querySelector('.card.sel');
  if (sel) sel.scrollIntoView({block:'nearest', behavior:'smooth'});
}

function updateAmountState(){
  const v = $('amount').value;
  const err = amountError(v);
  $('amountHint').textContent = (v && err) ? err : '';
  const ok = !err;
  const sel = findUser(selectedId);
  $('rechargeBtn').disabled = !ok || !sel;
  $('deductBtn').disabled = !ok || !sel;
}

/* ============================================================
   弹窗
   ============================================================ */
function closeModal(){ $('modalRoot').textContent = ''; }

function openDialog(node){
  const mask = el('div', {class:'mask center'}, [node]);
  mask.addEventListener('click', e => { if (e.target === mask) closeModal(); });
  $('modalRoot').textContent = '';
  $('modalRoot').appendChild(mask);
  return mask;
}

/** 删除二次确认：自绘弹窗，不用 window.confirm（钉钉 webview 渲染不可控） */
function confirmDelete(u){
  const dlg = el('div', {class:'dialog'}, [
    el('h3', {text:'确认删除 ' + u.name + '？'}),
    el('p', {text:'当前余额 ¥' + fmtFen(u.balanceFen)
              + '，删除后该成员的记录将从列表中移除。操作记录会保留。'}),
    el('div', {class:'row'}, [
      el('button', {class:'btn btn-ghost', text:'取 消', onclick: closeModal}),
      el('button', {class:'btn btn-red', text:'删 除', onclick: () => {
        closeModal();
        if (selectedId === u.id) selectedId = null;
        deleteUser(u.id);
        toast('已删除 ' + u.name);
        render();
      }}),
    ]),
  ]);
  openDialog(dlg);
}

function openAddUser(){
  const input = el('input', {type:'text', placeholder:'输入名字', maxlength:'20',
                             autocomplete:'off'});
  const dlg = el('div', {class:'dialog'}, [
    el('h3', {text:'新增用户'}),
    el('div', {class:'field'}, [input]),
    el('div', {class:'row'}, [
      el('button', {class:'btn btn-ghost', text:'取 消', onclick: closeModal}),
      el('button', {class:'btn btn-primary', text:'添 加', onclick: submit}),
    ]),
  ]);
  function submit(){
    const u = addUser(input.value);
    if (!u) return;
    closeModal();
    selectedId = u.id;
    toast('已添加 ' + u.name);
    render();
    $('amount').focus();
  }
  input.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
  openDialog(dlg);
  setTimeout(() => input.focus(), 50);
}

function openOperator(force){
  const input = el('input', {type:'text', placeholder:'你的名字', maxlength:'20',
                             value: operator, autocomplete:'off'});
  const dlg = el('div', {class:'dialog'}, [
    el('h3', {text:'设置操作人'}),
    el('p', {text:'用于在操作记录里标明是谁做的。仅本机记住，可随时点击右上角修改。'}),
    el('div', {class:'field'}, [input]),
    el('div', {class:'row'}, [
      force ? null : el('button', {class:'btn btn-ghost', text:'取 消', onclick: closeModal}),
      el('button', {class:'btn btn-primary', text:'确 定', onclick: save}),
    ]),
  ]);
  function save(){
    const v = input.value.trim();
    if (!v){ toast('请输入名字'); return; }
    operator = v;
    localStorage.setItem('meal_operator', v);
    $('opName').textContent = v;
    closeModal();
    toast('操作人已设为 ' + v);
    render();
  }
  input.addEventListener('keydown', e => { if (e.key === 'Enter') save(); });
  openDialog(dlg);
  setTimeout(() => input.focus(), 50);
}

/* ============================================================
   操作日志
   ============================================================ */
const ACTION_TEXT = {add_user:'新增', delete_user:'删除', recharge:'充值', deduct:'扣除'};
let logFilter = '';
let logLimit = 50;

function fmtDay(ts){
  const d = ts.slice(0, 10);
  const wd = ['日','一','二','三','四','五','六'][new Date(d + 'T00:00:00').getDay()];
  return d + ' 星期' + wd;
}

function logRow(x){
  const parts = [
    el('span', {class:'badge ' + x.action, text: ACTION_TEXT[x.action] || x.action}),
    el('span', {class:'who', text: x.userName}),
  ];
  if (x.amountFen){
    parts.push(el('span', {class:'delta ' + x.action,
      text: (x.amountFen > 0 ? '+' : '') + fmtFen(x.amountFen)}));
    if (x.balanceAfterFen != null){
      parts.push(el('span', {class:'after', text:'→ ¥' + fmtFen(x.balanceAfterFen)}));
    }
  } else if (x.action === 'delete_user' && x.note){
    parts.push(el('span', {class:'after', text: x.note}));
  }
  return el('div', {class:'log'}, [
    el('div', {class:'l1'}, parts),
    el('div', {class:'l2', text: (x.operator || '未署名') + ' · ' + x.ts.slice(11, 16)
              + (x.note && x.action !== 'delete_user' ? ' · ' + x.note : '')}),
  ]);
}

function renderLogs(){
  const body = $('logBody');
  body.textContent = '';

  let rows = state.logs.slice().reverse();          // 新的在前
  if (logFilter) rows = rows.filter(x => x.action === logFilter);
  const total = rows.length;
  const shown = rows.slice(0, logLimit);

  if (!shown.length){
    body.appendChild(el('div', {class:'empty',
      text: total ? '该分类下暂无记录' : '还没有操作记录'}));
    return;
  }

  let lastDay = null;
  shown.forEach(x => {
    const day = fmtDay(x.ts);
    if (day !== lastDay){
      body.appendChild(el('div', {class:'day-head', text: day}));
      lastDay = day;
    }
    body.appendChild(logRow(x));
  });

  if (total > shown.length){
    body.appendChild(el('button', {class:'btn btn-ghost',
      text: '加载更多（还有 ' + (total - shown.length) + ' 条）',
      onclick: () => { logLimit += 50; renderLogs(); }}));
  } else if (total > 50){
    body.appendChild(el('div', {class:'empty', text:'已到底部'}));
  }
}

function openLogs(){
  const filters = [['', '全部'], ['recharge', '充值'], ['deduct', '扣除'],
                   ['add_user', '新增'], ['delete_user', '删除']];
  const chips = el('ul', {class:'chips'}, filters.map(([v, t]) =>
    el('li', {}, [el('button', {class: v === logFilter ? 'on' : '', text: t,
      onclick: () => { logFilter = v; logLimit = 50; openLogs(); }})])));

  const sheet = el('div', {class:'sheet'}, [
    el('div', {class:'sheet-head'}, [
      el('h3', {text:'操作记录'}),
      el('button', {class:'btn', style:'width:auto;min-height:auto;padding:8px 12px',
                    text:'关闭', onclick: closeModal}),
    ]),
    el('div', {class:'sheet-body', id:'logBody'}, [chips]),
  ]);
  const mask = el('div', {class:'mask'}, [sheet]);
  mask.addEventListener('click', e => { if (e.target === mask) closeModal(); });
  $('modalRoot').textContent = '';
  $('modalRoot').appendChild(mask);
  renderLogs();
}

/* ============================================================
   导出 / 导入
   ============================================================ */
function exportData(){
  if (!state.users.length && !state.logs.length){
    toast('还没有数据可以导出');
    return;
  }
  const payload = {
    app: 'meal_balance',
    version: DATA_VERSION,
    exportedAt: nowStr(),
    data: state,
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)],
                        {type: 'application/json;charset=utf-8'});
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  const name = '餐补余额备份_' + d.getFullYear() + p(d.getMonth()+1) + p(d.getDate())
             + '_' + p(d.getHours()) + p(d.getMinutes()) + '.json';
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  toast('已导出 ' + name);
}

function validateImport(d){
  if (!d || typeof d !== 'object') return '文件内容不是有效的 JSON 对象';
  const data = d.data || d;
  if (!Array.isArray(data.users)) return '缺少 users 列表';
  if (!Array.isArray(data.logs)) return '缺少 logs 列表';
  for (const u of data.users){
    if (typeof u.name !== 'string') return '成员数据格式不对（name 字段）';
    if (typeof u.balanceFen !== 'number' || !isFinite(u.balanceFen))
      return '成员数据格式不对（balanceFen 字段）';
  }
  return '';
}

function doImport(file){
  const r = new FileReader();
  r.onload = () => {
    let d;
    try { d = JSON.parse(r.result); }
    catch (e){ toast('导入失败：不是合法的 JSON 文件'); return; }
    const err = validateImport(d);
    if (err){ toast('导入失败：' + err); return; }

    const data = d.data || d;
    const n = data.users.length;
    const m = data.logs.length;

    const dlg = el('div', {class:'dialog'}, [
      el('h3', {text:'确认导入？'}),
      el('p', {text:'该备份含 ' + n + ' 位成员、' + m + ' 条操作记录。'
                + '导入后会【覆盖】当前本机的全部数据，此操作不可撤销。'}),
      el('p', {class:'tip', text:'如果当前数据还需要，请先点「导出备份」留一份。'}),
      el('div', {class:'row'}, [
        el('button', {class:'btn btn-ghost', text:'取 消', onclick: closeModal}),
        el('button', {class:'btn btn-red', text:'覆盖导入', onclick: () => {
          state = {
            version: DATA_VERSION,
            users: data.users,
            logs: data.logs,
            seq: typeof data.seq === 'number' ? data.seq : 1,
          };
          if (typeof state.seq !== 'number') state.seq = 1;
          selectedId = null;
          saveData();
          closeModal();
          render();
          toast('已导入 ' + n + ' 位成员、' + m + ' 条记录');
        }}),
      ]),
    ]);
    openDialog(dlg);
  };
  r.onerror = () => toast('读取文件失败');
  r.readAsText(file, 'utf-8');
}

function pickImportFile(){
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = '.json,application/json';
  inp.addEventListener('change', () => {
    if (inp.files && inp.files[0]) doImport(inp.files[0]);
  });
  inp.click();
}

/* ============================================================
   事件绑定
   ============================================================ */
function submitTxn(kind){
  const sel = findUser(selectedId);
  if (!sel) return;
  const amount = $('amount').value;
  const err = amountError(amount);
  if (err){ toast(err); return; }
  const r = applyTxn(sel.id, amount, kind, $('note').value.trim());
  if (!r) return;
  $('amount').value = '';
  $('note').value = '';
  toast((kind === 'recharge' ? '已充值 ' : '已扣除 ') + amount + ' 元，余额 ¥'
        + fmtFen(r.user.balanceFen));
  render();
}

$('opChip').addEventListener('click', () => openOperator(false));
$('addBtn').addEventListener('click', openAddUser);
$('logBtn').addEventListener('click', openLogs);
$('exportBtn').addEventListener('click', exportData);
$('importBtn').addEventListener('click', pickImportFile);
$('rechargeBtn').addEventListener('click', () => submitTxn('recharge'));
$('deductBtn').addEventListener('click', () => submitTxn('deduct'));
$('amount').addEventListener('input', e => {
  const f = filterAmount(e.target.value);
  if (f !== e.target.value) e.target.value = f;
  updateAmountState();
});
$('note').addEventListener('input', updateAmountState);

/* ============================================================
   启动
   ============================================================ */
(function start(){
  storageOK = checkStorage();
  if (!storageOK){
    $('notice').textContent = '';
    $('notice').appendChild(el('b', {
      text:'⚠ 当前浏览器无法保存数据（可能是无痕/隐私模式）。'
           + '数据关掉页面就会丢失，请不要在这里记录重要数据。'}));
    $('notice').style.background = '#fff3f2';
    $('notice').style.color = '#d93025';
    $('notice').style.borderColor = '#ffd9d5';
  }
  loadData();
  $('opName').textContent = operator || '未设置';
  render();
  if (!operator) openOperator(true);
})();
</script>
</body>
